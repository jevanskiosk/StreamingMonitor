
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanksgiving Mystery Month - Library Playlist</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background-color: black;
    }

    /* =========================
       THANKSGIVING TOP CRAWL
       ========================= */

    .crawler {
      position: fixed;
      top: 3%;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
      white-space: nowrap;
    }

    .crawler__inner {
      display: inline-block;
      animation: crawl 20s linear infinite;
    }

    .crawler__text {
      display: inline-block;
      padding-right: 10rem;

      font-size: 4rem;
      font-weight: bold;
      font-family: Georgia, "Times New Roman", serif;

      color: #f5bd58;

      -webkit-text-stroke: 2px #3b200d;

      text-shadow:
        3px 3px 0 #000,
        -3px -3px 0 #000,
        3px -3px 0 #000,
        -3px 3px 0 #000,
        0 0 8px #c46b24,
        0 0 18px rgba(255, 153, 51, 0.8);
    }

    @keyframes crawl {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    /* Dark transparent area behind crawl
       for better readability */
    .crawler::before {
      content: "";
      position: absolute;
      top: -20px;
      left: 0;
      right: 0;
      height: 110px;
      background: rgba(0, 0, 0, 0.35);
      z-index: -1;
    }

    @media (max-width: 600px) {
      .crawler__text {
        font-size: 2rem;
        -webkit-text-stroke: 1px #3b200d;
      }

      .crawler::before {
        height: 70px;
      }
    }
  </style>
</head>

<body>

  <!-- ==========================================
       FULLSCREEN YOUTUBE THANKSGIVING PLAYLIST
       ========================================== -->

  <iframe
    src="https://www.youtube.com/embed/videoseries?list=PLoNXhSmdR5P3ugjmTtRA_6Rjdz_I6CYJH&autoplay=1&loop=1&mute=0&playlist=PLoNXhSmdR5P3ugjmTtRA_6Rjdz_I6CYJH"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>


  <!-- ==========================================
       THANKSGIVING / MYSTERY MONTH CRAWL
       ========================================== -->

  <div class="crawler">

    <div class="crawler__inner">

      <span class="crawler__text">
        🦃 🍂 It's Thanksgiving Mystery Month! 🔍
        Get cozy, solve a mystery, and discover your next great read! 📚 🍁
      </span>

      <span class="crawler__text">
        🦃 🍂 It's Thanksgiving Mystery Month! 🔍
        Get cozy, solve a mystery, and discover your next great read! 📚 🍁
      </span>

    </div>

  </div>

</body>
</html>
