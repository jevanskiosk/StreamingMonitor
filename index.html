
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanksgiving - Library Playlist</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background-color: black;
    }

    /* =========================
       THANKSGIVING TOP CRAWL
       ========================= */

    .crawler {
      position: fixed;
      top: 3%;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
      white-space: nowrap;
    }

    .crawler__inner {
      display: inline-block;
      animation: crawl 35s linear infinite;
    }

    .crawler__text {
      display: inline-block;
      padding-right: 10rem;

      font-size: 4rem;
      font-weight: bold;
      font-family: Georgia, "Times New Roman", serif;

      color: #ffbd45;

      -webkit-text-stroke: 2px #542508;

      text-shadow:
        3px 3px 0 #542508,
        -3px -3px 0 #542508,
        3px -3px 0 #542508,
        -3px 3px 0 #542508,
        0 0 8px #e87916,
        0 0 18px rgba(255, 153, 30, 0.7);
    }

    @keyframes crawl {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    /* Dark transparent area behind crawl
       for better readability */
    .crawler::before {
      content: "";
      position: absolute;
      top: -20px;
      left: 0;
      right: 0;
      height: 110px;
      background: rgba(45, 22, 5, 0.45);
      z-index: -1;
    }

    @media (max-width: 600px) {
      .crawler__text {
        font-size: 2rem;
        -webkit-text-stroke: 1px #542508;
      }

      .crawler::before {
        height: 70px;
      }
    }
  </style>
</head>

<body>

  <!-- ==========================================
       FULLSCREEN YOUTUBE THANKSGIVING PLAYLIST
       ========================================== -->

  <iframe
    src="https://www.youtube.com/embed/videoseries?si=29qGwGn2G5J4Ln1j&list=PLoNXhSmdR5P32cY027P9Aq_VWI6Xk4Bw6&autoplay=1&loop=1&mute=0&playlist=PLoNXhSmdR5P32cY027P9Aq_VWI6Xk4Bw6"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>


  <!-- ==========================================
       THANKSGIVING HARVEST CRAWL
       ========================================== -->

  <div class="crawler">

    <div class="crawler__inner">

      <span class="crawler__text">
        🦃 🍂 Happy Thanksgiving, Monsoons! 🍁
        We're thankful you're part of our library!
        📚 Find a good book, get cozy, and enjoy your break! 🎃
      </span>

      <span class="crawler__text">
        🦃 🍂 Happy Thanksgiving, Monsoons! 🍁
        We're thankful you're part of our library!
        📚 Find a good book, get cozy, and enjoy your break! 🎃
      </span>

    </div>

  </div>

</body>
</html>
